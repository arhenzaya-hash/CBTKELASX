const SOAL=[{"q": "Setelah hujan deras di Masohi, Bu Rina menemukan benda berwarna putih berbentuk payung yang tumbuh pada batang kelapa lapuk di belakang rumahnya. Setelah diamati, benda tersebut tidak berwarna hijau, tidak dapat bergerak, dan jika dibelah halus tampak tersusun atas benang-benang halus yang saling menjalin.\n\nCiri tubuh jamur yang paling tepat dan membedakannya dari tumbuhan adalah .....", "o": ["Prokariotik, dinding sel peptidoglikan, dan menyerap nutrisi dengan cara fotosintesis", "Eukariotik, dinding sel dari kitin, tubuh tersusun atas hifa, dan tidak memiliki klorofil", "Eukariotik, dinding sel dari selulosa, memiliki klorofil, dan memiliki akar sejati", "Eukariotik, dinding sel dari kitin, dan memiliki kloroplas sehingga mampu berfotosintesis", "Prokariotik, dinding sel dari kitin, tubuh tersusun atas hifa, dan tidak memiliki membran inti"], "k": 1}, {"q": "Di sebuah dusun di Pulau Seram, ampas sagu hasil pemerasan ditumpuk di belakang rumah. Beberapa hari kemudian tumpukan itu basah dan ditumbuhi benang-benang putih halus. Lama-kelamaan, ampas sagu tersebut menjadi lapuk, lunak, dan volumenya menyusut.\n\nCara jamur memperoleh makanan dari ampas sagu tersebut yang paling tepat adalah .....", "o": ["Autotrof, jamur menyusun glukosa dari CO2 dan air dengan bantuan cahaya matahari", "Heterotrof secara parasit, hifa menyerap nutrisi dari sel-sel hidup ampas sagu", "Heterotrof secara holozoik, jamur menelan ampas sagu lalu mencernanya di dalam rongga pencernaan", "Heterotrof secara saprofit, hifa mengeluarkan enzim ke luar tubuh untuk menguraikan bahan organik, lalu hasil penguraiannya diserap", "Kemoautotrof, jamur memperoleh energi dari oksidasi senyawa anorganik pada ampas sagu"], "k": 3}, {"q": "Pak Daud, petani pala di Kepulauan Banda, menyimpan biji pala yang belum kering sempurna dalam karung di gudang yang pengap, lembap, hangat, dan minim cahaya. Dua minggu kemudian, biji pala tampak berbintik hijau kebiruan dan berbau apek.\n\nKondisi lingkungan yang paling mendukung pertumbuhan jamur di gudang tersebut adalah .....", "o": ["Kelembapan tinggi, suhu hangat, cahaya sedikit, dan tersedia bahan organik", "Kelembapan rendah, suhu hangat, cahaya terang, dan tersedia bahan organik", "Kelembapan tinggi, suhu di bawah 0 °C, cahaya terang, dan tanpa bahan organik", "Kelembapan rendah, suhu di atas 60 °C, cahaya sedikit, dan hanya bahan anorganik", "Kelembapan tinggi, suhu hangat, cahaya terang, dan hanya bahan anorganik"], "k": 0}, {"q": "Seorang siswa mengamati jamur tempe (Rhizopus) dan jamur kuping (Auricularia) dengan mikroskop. Pada jamur tempe, hifa tampak seperti pipa panjang tanpa sekat melintang dan berisi banyak inti. Pada jamur kuping, hifa tampak memiliki sekat melintang. Pada kedua jamur, hifa-hifa tersebut saling menjalin dan tumbuh menembus substrat untuk menyerap nutrisi.\n\nPernyataan yang paling tepat tentang struktur tubuh kedua jamur tersebut adalah .....", "o": ["Hifa Rhizopus bersekat dan tiap selnya berinti satu, sedangkan hifa Auricularia tidak bersekat", "Hifa kedua jamur bersifat senositik, dan anyaman hifa penyerap nutrisi disebut tubuh buah", "Hifa Rhizopus tidak bersekat (senositik), hifa Auricularia bersekat, dan anyaman hifa penyerap nutrisi disebut miselium vegetatif", "Hifa kedua jamur tidak bersekat, dan anyaman hifa yang membentuk spora disebut miselium vegetatif", "Hifa kedua jamur bersekat, dan anyaman hifa penyerap nutrisi disebut haustorium"], "k": 2}, {"q": "Roti tawar yang disimpan di lemari dapur Bu Maria di Ambon ditumbuhi bulu-bulu halus putih kehitaman. Di bawah mikroskop, tampak kantong bulat berisi butiran-butiran halus di ujung hifa yang tegak. Pada pengamatan lain, ketika dua koloni dengan tipe kawin berbeda (+ dan −) tumbuh berdekatan, hifanya saling menjulur dan bertemu, lalu terbentuk struktur berdinding tebal, kasar, dan berwarna gelap.\n\nPernyataan yang tepat tentang reproduksi jamur tersebut adalah .....", "o": ["Butiran dalam kantong bulat adalah askospora hasil reproduksi seksual, dan struktur berdinding tebal adalah sporangium", "Butiran dalam kantong bulat adalah basidiospora hasil reproduksi aseksual, dan struktur berdinding tebal adalah basidium", "Butiran dalam kantong bulat adalah zigospora hasil konjugasi, dan struktur berdinding tebal adalah sporangiospora", "Butiran dalam kantong bulat adalah konidia hasil pertunasan, dan struktur berdinding tebal adalah zigospora hasil fragmentasi", "Butiran dalam kantong bulat adalah sporangiospora hasil reproduksi aseksual, dan struktur berdinding tebal adalah zigospora hasil konjugasi hifa tipe kawin + dan −"], "k": 4}, {"q": "Seorang siswa menambahkan ragi instan ke dalam adonan roti. Saat diamati di bawah mikroskop, sel ragi berbentuk oval dan pada beberapa sel tampak tonjolan kecil yang menempel pada sel induk. Pada kondisi nutrisi menipis, sel ragi juga dapat membentuk kantung yang berisi empat hingga delapan spora.\n\nCara reproduksi ragi (Saccharomyces) pada kedua kondisi tersebut secara berurutan adalah .....", "o": ["Aseksual dengan fragmentasi, seksual dengan membentuk basidiospora dalam basidium", "Aseksual dengan pertunasan (budding), seksual dengan membentuk askospora dalam askus", "Aseksual dengan membentuk sporangiospora, seksual dengan membentuk zigospora", "Aseksual dengan membentuk konidia, seksual dengan membentuk basidiospora", "Aseksual dengan pembelahan biner, seksual dengan membentuk zigospora"], "k": 1}, {"q": "Dalam kegiatan pengamatan di sekitar sekolah di Masohi, siswa mencatat tiga jamur. Jamur (1) Rhizopus oryzae pada tempe, hifanya tidak bersekat dan sporanya terbentuk di dalam sporangium. Jamur (2) Saccharomyces cerevisiae pada ragi tape, bersel tunggal dan sporanya terbentuk di dalam askus. Jamur (3) Pleurotus ostreatus (jamur tiram) pada kayu lapuk, tubuh buahnya berbentuk kipas dan sporanya terbentuk pada basidium.\n\nPengelompokan ketiga jamur tersebut secara berurutan yang tepat adalah .....", "o": ["Ascomycota, Zygomycota, Basidiomycota", "Zygomycota, Basidiomycota, Ascomycota", "Basidiomycota, Ascomycota, Zygomycota", "Zygomycota, Ascomycota, Basidiomycota", "Ascomycota, Basidiomycota, Zygomycota"], "k": 3}, {"q": "Seorang siswa memiliki bercak melingkar bersisik dan gatal di kulit lengannya setelah sering bermain di pantai. Dokter memeriksa kerokan kulitnya dan menemukan jamur dermatofita dengan hifa bersekat. Jamur tersebut hanya membentuk konidia, sedangkan tahap reproduksi seksualnya belum pernah ditemukan.\n\nKelompok jamur tersebut dan alasan pengelompokannya adalah .....", "o": ["Deuteromycota (jamur tidak sempurna), karena hanya membentuk konidia secara aseksual dan fase seksualnya belum diketahui", "Zygomycota, karena membentuk zigospora melalui konjugasi hifa", "Ascomycota, karena membentuk askospora di dalam askus", "Basidiomycota, karena membentuk basidiospora pada basidium", "Zygomycota, karena hifanya tidak bersekat dan membentuk sporangiospora"], "k": 0}, {"q": "Di lereng Gunung Binaiya, Pulau Seram, tampak lapisan berwarna abu-abu kehijauan yang menempel kuat pada batang pohon dan permukaan batu. Setelah diamati di bawah mikroskop, lapisan itu terdiri atas hifa jamur yang menyelimuti sel-sel alga hijau bersel tunggal. Organisme ini tetap hidup meski permukaan tempat menempelnya miskin tanah dan sering kering.\n\nJenis hubungan simbiosis dan peran masing-masing penyusunnya yang paling tepat adalah .....", "o": ["Parasitisme, jamur menyerap hasil fotosintesis alga sampai alga mati dan alga tidak memperoleh manfaat", "Komensalisme, alga memperoleh tempat menempel sedangkan jamur tidak memperoleh manfaat apa pun", "Mutualisme, alga berfotosintesis dan menyediakan senyawa organik, sedangkan jamur menyerap air dan mineral serta melindungi alga dari kekeringan", "Mutualisme, jamur berfotosintesis dan menyediakan karbohidrat, sedangkan alga menyerap air dan mineral", "Kompetisi, jamur dan alga bersaing memperoleh cahaya dan air pada permukaan batang pohon"], "k": 2}, {"q": "Petani pala di Kepulauan Banda mencampur tanah penyemaian dengan serasah hutan yang mengandung benang-benang jamur berwarna putih. Bibit pala yang ditanam pada media tersebut tumbuh lebih subur dibandingkan bibit pada media tanpa campuran, terutama pada tanah yang miskin fosfor. Pada pengamatan, hifa jamur tampak membungkus dan menembus ujung-ujung akar bibit.\n\nJenis hubungan simbiosis dan manfaatnya bagi kedua organisme adalah .....", "o": ["Parasitisme, jamur menyerap hasil fotosintesis sehingga akar rusak dan bibit menjadi kerdil", "Komensalisme, jamur memperoleh tempat tinggal dari akar sedangkan bibit tidak memperoleh manfaat", "Mutualisme, jamur memperoleh air dari akar sedangkan bibit memperoleh karbohidrat dari jamur", "Saprofitisme, jamur menguraikan akar bibit yang mati sehingga unsur hara tersedia kembali", "Mutualisme (mikoriza), hifa memperluas bidang serapan akar terhadap air dan fosfor, sedangkan jamur memperoleh gula hasil fotosintesis dari tanaman"], "k": 4}, {"q": "Bu Elsye membuat tape dari ubi kayu di Masohi. Ubi kayu dikukus, didinginkan, ditaburi ragi, lalu disimpan 2–3 hari dalam wadah tertutup. Hasilnya, ubi menjadi lunak dan berair, rasanya manis agak asam, serta beraroma khas.\n\nProses yang terjadi pada pembuatan tape tersebut adalah .....", "o": ["Jamur ragi berfotosintesis sehingga ubi kayu menghasilkan glukosa dan oksigen", "Amilum ubi kayu diuraikan oleh enzim jamur menjadi gula sederhana, lalu sebagian diubah menjadi etanol dan CO2 melalui fermentasi", "Protein ubi kayu diuraikan menjadi asam amino sehingga ubi menjadi lunak dan berbau busuk", "Jamur ragi menghasilkan antibiotik yang mengawetkan ubi kayu dan membuatnya manis", "Amilum diubah menjadi asam laktat dan oksigen melalui respirasi aerob oleh jamur ragi"], "k": 1}, {"q": "Petani kelapa di Pulau Seram menyimpan kopra yang belum kering sempurna karena hujan turun terus-menerus. Beberapa hari kemudian, kopra ditumbuhi jamur berwarna hijau kekuningan. Hasil pemeriksaan menunjukkan jamur tersebut Aspergillus flavus yang menghasilkan aflatoksin.\n\nPernyataan yang tepat tentang dampak jamur tersebut dan cara pencegahannya adalah .....", "o": ["Jamur menambah kandungan protein kopra sehingga kopra bergizi tinggi, dan pencegahannya dengan menyimpan kopra di tempat lembap", "Jamur menghasilkan antibiotik yang melindungi kopra, dan pencegahannya dengan menyiram kopra secara berkala", "Jamur menambah kandungan minyak kopra, dan pencegahannya dengan membungkus kopra basah rapat-rapat dalam plastik", "Jamur menghasilkan aflatoksin yang merusak hati dan menurunkan mutu kopra, dan pencegahannya dengan mengeringkan kopra hingga kadar air rendah serta menyimpannya di tempat kering dan berventilasi", "Jamur menghasilkan aflatoksin yang merusak hati, dan pencegahannya dengan menjemur kopra setengah kering lalu menyimpannya rapat dalam karung plastik"], "k": 3}, {"q": "Petani kopi di Pulau Seram menemukan bercak kuning kecokelatan pada permukaan atas daun kopi, sedangkan permukaan bawah daun tertutup serbuk berwarna jingga. Daun-daun akhirnya gugur sehingga hasil panen biji kopi menurun. Penyebabnya adalah jamur karat Hemileia vastatrix (Basidiomycota) yang hidup pada sel-sel daun yang masih hidup.\n\nPernyataan yang paling tepat tentang peran jamur tersebut dan cara pengendaliannya adalah .....", "o": ["Jamur parasit yang menyerap nutrisi inang melalui haustorium, dikendalikan dengan memangkas daun terserang, mengatur jarak tanam, dan memberi fungisida", "Jamur saprofit yang menguraikan daun mati, dikendalikan dengan menambah kompos agar daun tetap lembap", "Jamur mutualisme dengan akar kopi, dikendalikan dengan menyiram daun setiap sore", "Jamur saprofit yang menguraikan serasah, dikendalikan dengan insektisida", "Jamur parasit yang menyerap nutrisi melalui rizoid, dikendalikan dengan antibiotik"], "k": 0}, {"q": "Kelompok siswa SMA di Masohi membudidayakan jamur tiram putih (Pleurotus ostreatus) dengan memanfaatkan serbuk gergaji dari bengkel kayu. Serbuk dicampur dedak dan kapur, dimasukkan ke dalam kantong plastik (baglog), lalu dipanaskan hingga steril. Setelah dingin, baglog diberi bibit jamur dan disimpan di ruang gelap sampai benang-benang putih memenuhi media. Selanjutnya, baglog dipindahkan ke rumah jamur (kumbung) yang lembap hingga tumbuh tubuh buah.\n\nUrutan tahap pembiakan jamur tiram yang tepat adalah .....", "o": ["Inokulasi bibit → sterilisasi baglog → pencampuran media → inkubasi → pembentukan tubuh buah → panen", "Pencampuran media → inokulasi bibit → sterilisasi baglog → inkubasi → pembentukan tubuh buah → panen", "Pencampuran media dan pengisian baglog → sterilisasi dan pendinginan → inokulasi bibit → inkubasi sampai miselium memenuhi baglog → pembentukan tubuh buah di kumbung → panen", "Pencampuran media → inkubasi → sterilisasi → inokulasi bibit → pembentukan tubuh buah → panen", "Sterilisasi baglog → inokulasi bibit → pencampuran media → pembentukan tubuh buah → inkubasi → panen"], "k": 2}, {"q": "Kelompok usaha ibu-ibu di Masohi membuat tempe. Kedelai direbus, direndam semalam, dikupas kulitnya, dikukus, didinginkan, lalu ditaburi ragi tempe yang mengandung Rhizopus oligosporus. Kedelai dibungkus plastik yang diberi lubang-lubang kecil dan disimpan 36–48 jam di suhu ruang. Satu kelompok membungkus kedelai tanpa lubang. Hasilnya, kedelai di dalam bungkus tanpa lubang tidak ditutupi benang-benang putih dan berbau asam.\n\nPenjelasan yang paling tepat mengapa bungkus tempe harus dilubangi adalah .....", "o": ["Agar cahaya matahari masuk sehingga Rhizopus dapat berfotosintesis", "Agar Rhizopus mendapat sinar matahari sehingga dapat bertunas lebih cepat", "Agar suhu di dalam bungkus turun di bawah 10 °C sehingga hifa tumbuh lebih cepat", "Agar oksigen tidak masuk sehingga Rhizopus melakukan fermentasi alkohol dan kedelai menjadi lunak", "Agar oksigen masuk karena Rhizopus tumbuh secara aerob, sehingga hifanya mengikat biji kedelai dan enzimnya menguraikan protein serta lemak sehingga tempe menjadi kompak dan mudah dicerna"], "k": 4}];
